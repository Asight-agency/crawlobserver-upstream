<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CrawlObserver</title>
    <style>
      .preload-shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f8f9fc;
        color: #1e293b;
        font:
          14px Inter,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }
      .preload-content {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .preload-spinner {
        width: 24px;
        height: 24px;
        border: 2px solid #ddd6fe;
        border-top-color: #7c3aed;
        border-radius: 50%;
        animation: preload-spin 0.8s linear infinite;
      }
      .preload-content strong {
        display: block;
        margin-bottom: 3px;
        font-size: 15px;
      }
      .preload-content span {
        color: #64748b;
        font-size: 12px;
      }
      @keyframes preload-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-color-scheme: dark) {
        .preload-shell {
          background: #0f172a;
          color: #e2e8f0;
        }
        .preload-content span {
          color: #94a3b8;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .preload-spinner {
          animation-duration: 1.8s;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="preload-shell" role="status" aria-live="polite">
        <div class="preload-content">
          <span class="preload-spinner" aria-hidden="true"></span>
          <div>
            <strong>CrawlObserver</strong>
            <span>Starting local services...</span>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
